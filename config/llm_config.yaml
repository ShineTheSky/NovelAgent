# llm_config.yaml — LLM配置（可提交到git）
# API key 不要写在这里，通过环境变量引用

providers:
  anthropic:
    name: Anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    headers:
      anthropic-beta: prompt-caching-2024-07-31

  openai:
    name: OpenAI
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  deepseek:
    name: DeepSeek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro

  minimax:
    name: MiniMax
    base_url: https://api.minimax.chat/v1
    api_key_env: MINIMAX_API_KEY
    models:
      - MiniMax-M2.7

  openrouter:
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://github.com/novelagent2
      X-Title: NovelAgent2

  self_hosted:
    name: Self-Hosted vLLM
    base_url: http://192.168.1.100:8000/v1
    api_key_env: SELF_HOSTED_API_KEY

  azure_openai:
    name: Azure OpenAI
    base_url: https://{resource}.openai.azure.com/openai/deployments/{deployment}
    api_key_env: AZURE_OPENAI_API_KEY
    headers:
      api-version: "2024-10-21"

defaults:
  provider: minimax
  model: MiniMax-M2.7
  temperature: 0.7
  max_tokens: 8192
  timeout: 60
  retry:
    max_retries: 3
    backoff: exponential

positions:
  main_loop:
    provider: minimax
    # provider: deepseek
    # model: deepseek-v4-pro
    model: MiniMax-M2.7
    max_tokens: 16384
    timeout: 600

  sub_agent:
    provider: minimax
    # provider: deepseek
    # model: deepseek-v4-pro
    model: MiniMax-M2.7
    max_tokens: 8192
    temperature: 0.6
    timeout: 90
    overrides:
      chapter_writer:
        provider: minimax
        model: MiniMax-M2.7
        max_tokens: 16384
      reviewer:
        temperature: 0.3
      character_designer:
        temperature: 0.5
      outliner:
        temperature: 0.4

  memory_prefetch:
    provider: minimax
    model: MiniMax-M2.7
    max_tokens: 512
    temperature: 0
    timeout: 1.5

  context_compression:
    provider: minimax
    model: MiniMax-M2.7
    max_tokens: 4096
    temperature: 0.3
    timeout: 120

  auto_memory:
    provider: minimax
    model: MiniMax-M2.7
    max_tokens: 2048
    temperature: 0.3
    timeout: 30
