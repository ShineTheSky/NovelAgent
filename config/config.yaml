# NovelAgent2 主配置文件

# 项目工作目录（所有文件操作限制在此目录内，相对路径相对于项目根目录）
working_dir: "./workspace"

memory:
  global_dir: "global_memory"

# 安全配置
security:
  bash:
    working_dir: "./workspace"
    command_timeout: 30        # 秒
    max_output_size: 10240     # 字节（10KB）

  # Write/Edit 自动放行规则（glob模式）
  write_allow_rules:
    - pattern: "chapters/**"
    - pattern: "outlines/**"
    - pattern: "world/**"
    - pattern: "characters/**"
    - pattern: "reference/**"
    - pattern: ".memory/project_rules.md"
    - pattern: ".memory/references/**"

# 会话配置
session:
  token_limit: 150000           # 消息列表Token上限
  compression_threshold: 0.8    # 约 120K 时压缩；记忆分支超限时改走局部 turn 兜底
  max_turns: 30                # 单次任务最大循环轮次

# Agent Loop 配置
agent:
  loop_detection_threshold: 3  # 连续相同工具调用视为循环
  trace_interval: 5            # 默认每 5 个完成回合生成一个聚合 Trace

# 仅编码 Trace 中的用户输入；高置信度常规执行会跳过 LLM 记忆分析。
embedding:
    enabled: true
    model_path: "models/bge-base-zh-v1.5"
    routine_min_similarity: 0.70
    routine_min_margin: 0.12

# 全局 Agent Bad Case：先按类别积累，再异步生成仅供人工审核的根因与建议。
bad_case_analysis:
  enabled: true
  batch_size: 3
  max_cases: 12

# 所有 Bash 行为样本（含成功）按命令族聚合，用于提出受监控工具候选。
bash_case_analysis:
  enabled: true
  batch_size: 3
  max_cases: 20

# 日志配置
logging:
  level: "INFO"                 # DEBUG / INFO / WARNING / ERROR
  format: "json"                # json / text
