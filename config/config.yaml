# NovelAgent2 主配置文件

# 项目工作目录（所有文件操作限制在此目录内，相对路径相对于项目根目录）
working_dir: "./workspace"

memory:
  global_dir: "global_memory"
  knowledge:
    enabled: true
    recover_on_startup: false  # 旧 History 迁移与失败重试需显式触发，重载服务不发起付费分析
    recall_timeout: 30          # 同步等待；失败记 bad case 后继续当前任务
    candidate_limit: 40
    memory_vector_top_k: 20
    memory_merge_similarity: 0.97 # 严格大于才允许模型判断合并，不凭同方向更新
    memory_time_window_hours: 24
    memory_time_neighbors: 8
    graph_depth: 3
    graph_nodes: 128
    insight_limit: 12
    insight_tokens: 8000
    pattern_tokens: 8000
    pattern_promotion_weight: 200 # 初始65，实际使用+15，上限300；合并保留最高分而不累加
    analysis_input_tokens: 480000 # 包含 History、正文工具结果和校验纠错消息的本地输入预算
    analysis_output_tokens: 16384
    analysis_max_turns: 12       # 工具调用与校验纠错共用轮数，不额外无限重试
    analysis_timeout: 120

# 安全配置
security:
  bash:
    command_timeout: 30        # 秒
    max_output_size: 10240     # 字节（10KB）

  # Write/Edit 自动放行规则（glob模式）
  write_allow_rules:
    - pattern: "chapters/**"
    - pattern: "outlines/**"
    - pattern: "world/**"
    - pattern: "characters/**"
    - pattern: "reference/**"
    - pattern: ".memory/project_rules.md"
    - pattern: ".memory/references/**"

# 会话配置
session:
  token_limit: 150000           # 消息列表Token上限
  compression_threshold: 0.8    # 约 120K 时压缩；记忆分支超限时改走局部 turn 兜底
  max_turns: 50                # 单次任务最大循环轮次

# Agent Loop 配置
agent:
  loop_detection_threshold: 3  # 连续相同工具调用视为循环
  trace_interval: 5            # 默认每 5 个完成回合生成一个聚合 Trace

# 仅编码 Trace 中的用户输入；高置信度常规执行会跳过 LLM 记忆分析。
embedding:
    enabled: true
    model_path: "models/bge-base-zh-v1.5"
    routine_min_similarity: 0.70
    routine_min_margin: 0.12

# Bad Case 与 Bash Case 共用触发和样本窗口配置；模型路由见 llm_config.yaml 的 case_analysis。
case_analysis:
  enabled: true
  batch_size: 3
  max_cases: 20
